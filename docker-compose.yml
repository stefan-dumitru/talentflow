# Local development services. The API and frontend run on the host, not in containers.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: talentflow
      # Local-only credential for a container bound to localhost; never used outside this machine.
      POSTGRES_PASSWORD: talentflow
      POSTGRES_DB: talentflow
    ports:
      # Host port 5433, not 5432: a Postgres installed on the host machine may already own 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the test database.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azure Blob Storage emulator. Unused until Phase 3 (CV uploads).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
